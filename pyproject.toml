[project]
name = "statcatlib"
version = "0.11.0"
description = "Queryable open data catalog engine for DCAT-AP, StatDCAT-AP, CKAN, and SDMX"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "gabrielgellner", email = "gabrielgellner@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["sdmx", "dcat", "open-data", "catalog", "duckdb", "statistical-data", "ckan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "attrs>=26.1.0",
    # >=2.0: sdmxlib 0.70 moved its store to DuckDB 2.0, and the catalog
    # shares that store's connection. A catalog written here cannot be opened
    # by DuckDB 1.x, so by statcatlib 0.8 or earlier.
    "duckdb>=2.0.0",
    "httpx>=0.28",
    # >=0.70: needs Python 3.14 and DuckDB 2.0; `reg.data()` is gone, and a
    # component without a concept is refused as it is built. >=0.70.1:
    # `reg.obs()` asks Eurostat for CSV it serves, so `ingest_data()` can
    # fetch from it (sdmxlib GH-50). >=0.72: `sdmxlib.bundle`, the manifest
    # and checker `publish_bundle` and `check_bundle` build on (GH-3).
    "sdmxlib>=0.72.0",
]

[project.optional-dependencies]
search = ["lancedb>=0.39", "sentence-transformers>=3.0", "typer>=0.15", "rich>=15.0"]

[project.scripts]
statcat = "statcatlib.cli:main"

[project.urls]
Homepage = "https://github.com/StatCat-Suite/statcatlib"
Repository = "https://github.com/StatCat-Suite/statcatlib"
Documentation = "https://statcat-suite.github.io/statcatlib"
"Issue Tracker" = "https://github.com/StatCat-Suite/statcatlib/issues"
Changelog = "https://github.com/StatCat-Suite/statcatlib/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "statcatlib"

[tool.pydoclint]
style = "google"
# Signatures carry the types; Google style keeps them out of the prose, and
# both type checkers read the annotations. Default `true` reports 45 findings
# demanding docstring-side hints — a house-style disagreement, not defects.
arg-type-hints-in-docstring = false
check-style-mismatch = true
# The annotation carries the return type too, for the same reason it carries
# the argument types — see above.
check-return-types = false
check-yield-types = false
# Google style documents __init__'s arguments in either the class docstring or
# __init__'s own. `Catalog.__init__` takes nine, documented where they are
# declared; hoisting them into the class docstring moves them away from the
# signature for no gain.
allow-init-docstring = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `strict` makes an unregistered marker a collection error: a typo such as
# `pytest.mark.uint` would otherwise drop a whole file out of `just ci`, which
# selects by marker (GH-8). It also rejects duplicate parametrize ids.
strict = true
# A warning that cannot fail is a warning nobody reads. The suite raised seven
# when this went on, all statcatlib's own: each test now asserts the warning
# its setup provokes, or avoids it as a real caller would. No ignore list.
filterwarnings = ["error"]
markers = [
    "unit: fast, in-process tests with no network I/O",
    "integration: tests that use real DuckDB and sdmxlib but no network",
    "live: tests that make real HTTP calls to external SDMX endpoints",
]

[tool.coverage.run]
source = ["src/statcatlib"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 88% when this was set (2026-10-23, `just coverage`). A floor, a little under
# that, so a change that drops a module's tests fails here. `sources/sdmx.py`
# is the lowest at 54%: `ingest_data` is reached only by the `live` tier.
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[dependency-groups]
dev = [
    "lancedb>=0.39",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "polars>=1.39.3",
    # The checkers are capped, as sdmxlib's are: uv.lock is gitignored, so an
    # uncapped checker's next release would change what `just ci` reports
    # without a commit. A bump goes in its own PR, with its findings fixed.
    "pydoclint>=0.11.1,<0.12",
    "pyrefly>=1.4.0,<1.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.35",
    "rich>=15.0",
    "ruff>=0.17.1,<0.18",
    "sentence-transformers>=3.0",
    "typer>=0.15",
    "watchfiles>=1.1.1",
]
