site_name: statcatlib
site_description: Queryable open data catalog engine for DCAT-AP, StatDCAT-AP, CKAN, and SDMX
site_author: Gabriel Gellner
site_url: "https://statcat-suite.github.io/statcatlib/"
repo_url: "https://github.com/StatCat-Suite/statcatlib"
repo_name: "StatCat-Suite/statcatlib"

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Tutorial: tutorial.md
  - API Reference:
    - Catalog: api/store.md
    - Bundles: api/bundles.md
    - Domain Model: api/model.md
    - Query Filters: api/query.md
    - Source Connectors: api/sources.md
