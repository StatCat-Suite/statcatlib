site_name: statcatlib
site_description: Queryable open data catalog engine for DCAT-AP, StatDCAT-AP, CKAN, and SDMX
site_author: Gabriel Gellner
site_url: "https://statcat-suite.github.io/statcatlib/"
repo_url: "https://github.com/StatCat-Suite/statcatlib"
repo_name: "StatCat-Suite/statcatlib"

# ── Suite configuration ─────────────────────────────────────────────────────
# The StatCat Suite block, copied from https://statcat-suite.github.io/sites/
# (the hub repository's docs/sites.md). Change it there first; every project
# site carries the same block, so the sites share one look.

validation:
  links:
    anchors: warn

extra_css:
  - https://statcat-suite.github.io/assets/stylesheets/statcat.css

theme:
  name: material
  logo: https://statcat-suite.github.io/assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  favicon: https://statcat-suite.github.io/assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow

extra:
  homepage: https://statcat-suite.github.io/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StatCat-Suite
      name: StatCat Suite on GitHub

copyright: 'Part of the <a href="https://statcat-suite.github.io/">StatCat Suite</a>'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# ── End of suite configuration ──────────────────────────────────────────────

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # sdmxlib's inventory, so `[Name][sdmxlib.Name]` and the sdmxlib
          # types in a generated signature link to its site (GH-56).
          inventories:
            - https://statcat-suite.github.io/sdmxlib/objects.inv
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 3
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Overview: index.md
  - Tutorial: tutorial.md
  - How Search Works: search.md
  - Bundle Format: bundle-format.md
  - API Reference:
    - Catalog: api/store.md
    - Bundles: api/bundles.md
    - Domain Model: api/model.md
    - Query Filters: api/query.md
    - Source Connectors: api/sources.md
  - Reference:
    - Catalog: reference/catalog.md
    - Scopes: reference/scopes.md
    - Domain Model: reference/model.md
    - Query: reference/query.md
    - Sources: reference/sources.md
    - Bundles: reference/bundle.md
    - URNs: reference/urn.md
    - Testing: reference/testing.md
  - Design:
    - Sitemap: design/SITEMAP.md
    - "RFC: Products, editions and the Inventory": design/products-editions-inventory.md
  - StatCat Suite: https://statcat-suite.github.io/
